<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/midea-queries.css">
    <title>Login de Acesso</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja be-vindo(a). faça login para acessar sua conta</p>
                <form action="login.html" method="post">
                    <div class="campo">                        
                        <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" required>
                        <label for="ilogin">Login</label>
                    </div>
                    <div>                        
                        <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required>
                        <label for="isenha">Senha</label>
                    </div>
                    <div class="campo">
                        <input type="checkbox" name="lembrar" id="ilembra">
                        <label for="ilembra">Lembrar-me</label>
                    </div>
                    <div class="campo">
                        <button type="submit">Entrar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
