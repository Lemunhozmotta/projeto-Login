<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/midea-queries.css">
    <title>Login de Acesso</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!--Aqui vai a imagem nas CSS-->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja be-vindo(a). faça login para acessar sua conta</p>
                <form action="login.html" method="post" autocomplete="on">
                    <div class="campoText">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" required masxlength="30">
                        <label for="ilogin">Login</label>
                    </div>                    
                    <div class="campoText">   
                        <span class="material-symbols-outlined">key</span>                     
                        <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required minlength="6" maxlength="12">
                        <label for="isenha">Senha</label>
                    </div>
                    <div class="campo">
                        <input type="checkbox" name="lembrar" id="ilembra">
                        <label for="ilembra">Lembrar-me</label>
                    </div>
                    <div class="campo">
                        <button type="submit">Entrar</button>
                    </div>
                    <div id="esqueci">
                        <p>Esqueceu sua senha? Ou ainda nao tem cadastro? <a href="esqueci.html">Clique aqui</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
